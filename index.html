<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>SMART COOKING™</title>

<style>
:root {
  --bg: #000000;
  --fg: #39ff14;
  --panel: #101010;
  --border: #333333;
  --muted: #999999;
  --overlay: rgba(0,0,0,0.65);
}

[data-theme="light"] {
  --bg: #ffffff;
  --fg: #159b08;
  --panel: #f2f2f2;
  --border: #dddddd;
  --muted: #666666;
  --overlay: rgba(0,0,0,0.35);
}

* {
  box-sizing: border-box;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: monospace;
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.3s, color 0.3s;
}

.menu-button {
  position: fixed;
  top: 18px;
  right: 18px;
  width: 45px;
  height: 45px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--panel);
  color: var(--fg);
  font-size: 25px;
  cursor: pointer;
  z-index: 10;
}

.menu-button:active {
  transform: scale(0.94);
}

a.btn {
  font-size: 18px;
  padding: 12px 26px;
  color: var(--fg);
  border: 2px solid var(--fg);
  border-radius: 4px;
  text-decoration: none;
  box-shadow: 0 0 12px var(--fg);
}

a.btn:active {
  background: var(--fg);
  color: var(--bg);
}

.overlay {
  position: fixed;
  inset: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: 0.3s;
  z-index: 20;
}

.overlay.active {
  opacity: 1;
  visibility: visible;
}

.sidebar {
  position: fixed;
  top: 0;
  right: 0;
  width: min(300px, 85vw);
  height: 100%;
  height: 100dvh;
  background: var(--panel);
  border-left: 1px solid var(--border);
  padding: 24px 20px;
  transform: translateX(105%);
  transition: transform 0.3s ease;
  z-index: 21;
}

.sidebar.active {
  transform: translateX(0);
}

.sidebar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
  padding-bottom: 16px;
}

.sidebar-header h2 {
  font-size: 19px;
  margin: 0;
}

.close-button {
  background: none;
  border: none;
  color: var(--fg);
  font-size: 25px;
  cursor: pointer;
}

.setting-title {
  margin-top: 28px;
  margin-bottom: 15px;
  font-size: 15px;
}

.theme-options {
  display: flex;
  gap: 10px;
}

.theme-option {
  flex: 1;
  padding: 15px 8px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--bg);
  color: var(--fg);
  font-family: monospace;
  font-size: 14px;
  cursor: pointer;
}

.theme-option.selected {
  border: 2px solid var(--fg);
  box-shadow: 0 0 9px var(--fg);
}

footer {
  position: fixed;
  bottom: 12px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 13px;
  opacity: 0.8;
  direction: ltr;
}

body {
  flex-direction: column;
  gap: 24px;
}

.content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
  width: min(88%, 360px);
}

.game-card {
  display: block;
  width: 100%;
  padding: 22px;
  border: 1px solid #ff922e;
  border-radius: 12px;
  background: #160e08;
  color: #ff922e;
  text-decoration: none;
  text-align: center;
  box-shadow: 0 0 12px #ff922e55;
  transition: 0.25s;
}

.game-card:active {
  transform: scale(0.97);
  box-shadow: 0 0 22px #ff922e;
}

.game-icon {
  font-size: 30px;
  margin-bottom: 10px;
}

.game-title {
  font-size: 21px;
  font-weight: bold;
}

.game-action {
  display: inline-block;
  margin-top: 15px;
  padding: 8px 20px;
  border: 1px solid #ff922e;
  border-radius: 5px;
  font-size: 13px;
}


.account-text{font-size:13px;color:var(--muted);margin:0 0 12px;word-break:break-all}
.account-btn{display:block;width:100%;padding:13px 8px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--fg);font-family:monospace;font-size:14px;text-align:center;text-decoration:none;cursor:pointer}
.account-btn:active{border-color:var(--fg);box-shadow:0 0 9px var(--fg)}
[hidden]{display:none !important}

/* hero-step */
html{scroll-behavior:smooth}
.hero{width:min(88%,360px);min-height:62svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
.hero h1{font-size:30px;margin:0;letter-spacing:1px;text-shadow:0 0 14px var(--fg)}
.tagline{margin:0;color:var(--muted);font-size:15px;line-height:1.7;direction:ltr}
#games{scroll-margin-top:24px}

/* scroll-step */
body{justify-content:flex-start;padding:84px 0 0;}
.content{margin:auto 0;padding-bottom:24px;}

/* footer-step */
footer{position:static !important;width:100%;margin-top:auto;padding:36px 12px 22px;text-align:center}

/* BACKGROUND STUDIO */
html {
  background: var(--bg);
}

body {
  background: transparent;
  isolation: isolate;
}

#backgroundLayer {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
  background: var(--bg);
}

#backgroundImage {
  position: absolute;
  inset: -18px;
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  filter: blur(var(--background-blur, 0px));
  transform: scale(1.04);
  opacity: 0;
  transition: opacity 0.25s;
}

#backgroundStudio {
  margin-top: 28px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
}

#backgroundStudio h3 {
  margin: 0 0 15px;
  font-size: 15px;
}

.background-modes {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
}

.background-mode {
  padding: 11px 4px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--bg);
  color: var(--fg);
  font-family: monospace;
  font-size: 12px;
  cursor: pointer;
}

.background-mode.selected {
  border: 2px solid var(--fg);
  box-shadow: 0 0 8px var(--fg);
}

.background-panel {
  margin-top: 17px;
}

.background-field {
  display: block;
  margin-top: 15px;
  font-size: 13px;
  color: var(--fg);
}

.background-field input[type="color"] {
  display: block;
  width: 100%;
  height: 42px;
  margin-top: 8px;
  padding: 3px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--bg);
}

.background-field input[type="range"] {
  display: block;
  width: 100%;
  margin-top: 12px;
  accent-color: var(--fg);
}

.background-field input[type="file"] {
  display: block;
  width: 100%;
  margin-top: 10px;
  color: var(--muted);
  font-family: monospace;
  font-size: 11px;
}

.background-value {
  color: var(--muted);
  font-size: 12px;
}

.background-reset {
  width: 100%;
  margin-top: 20px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--bg);
  color: var(--fg);
  font-family: monospace;
  cursor: pointer;
}

.background-status {
  min-height: 18px;
  margin: 10px 0 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.6;
}

</style>
</head>

<div id="backgroundLayer" aria-hidden="true"><div id="backgroundImage"></div></div>

<button class="menu-button" id="menuButton"
        aria-label="فتح الإعدادات"
        aria-expanded="false">
  ⋮
</button>

<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar"

  <div class="sidebar-header">
    <h2>الإعدادات</h2>

    <div class="background-modes">

<script>
const menuButton = document.getElementById("menuButton");
const closeButton = document.getElementById("closeButton");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const themeButtons = document.querySelectorAll("[data-theme-choice]");

function openMenu() {
  sidebar.classList.add("active");
  overlay.classList.add("active");
  sidebar.setAttribute("aria-hidden", "false");
  menuButton.setAttribute("aria-expanded", "true");
}

function closeMenu() {
  sidebar.classList.remove("active");
  overlay.classList.remove("active");
  sidebar.setAttribute("aria-hidden", "true");
  menuButton.setAttribute("aria-expanded", "false");
}

menuButton.addEventListener("click", openMenu);
closeButton.addEventListener("click", closeMenu);
overlay.addEventListener("click", closeMenu);

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") closeMenu();
});

function setTheme(theme) {
  if (theme === "light") {
    document.documentElement.dataset.theme = "light";
  } else {
    document.documentElement.dataset.theme = "dark";
  }

  localStorage.setItem("smartCookingTheme", theme);

  themeButtons.forEach(button => {
    const selected = button.dataset.themeChoice === theme;
    button.classList.toggle("selected", selected);
    button.setAttribute("aria-pressed", selected);
  });

  document.querySelector('meta[name="theme-color"]')
    .setAttribute("content", theme === "light" ? "#ffffff" : "#000000");
}

const savedTheme = localStorage.getItem("smartCookingTheme") || "dark";
setTheme(savedTheme);

themeButtons.forEach(button => {
  button.addEventListener("click", () => {
    setTheme(button.dataset.themeChoice);
  });
});
</script>



<script>
(function () {
  const layer = document.getElementById("backgroundLayer");
  const imageLayer = document.getElementById("backgroundImage");
  const modeButtons = document.querySelectorAll("[data-background-mode]");
  const panels = document.querySelectorAll("[data-background-panel]");
  const colorInput = document.getElementById("backgroundColor");
  const color1Input = document.getElementById("gradientColor1");
  const color2Input = document.getElementById("gradientColor2");
  const angleInput = document.getElementById("gradientAngle");
  const angleValue = document.getElementById("gradientAngleValue");
  const imageInput = document.getElementById("backgroundImageInput");
  const blurInput = document.getElementById("backgroundBlur");
  const blurValue = document.getElementById("backgroundBlurValue");
  const resetButton = document.getElementById("backgroundReset");
  const status = document.getElementById("backgroundStatus");

  const STORAGE_KEY = "smartCookingBackground";
  const DB_NAME = "SmartCookingBackgroundDB";
  const DB_STORE = "backgrounds";
  const DB_KEY = "user-background";

  const defaults = {
    mode: "color",
    color: "#000000",
    color1: "#000000",
    color2: "#159b08",
    angle: 135,
    blur: 0
  };

  let settings = { ...defaults };
  let imageUrl = null;

  function say(message) {
    status.textContent = message;
  }

  function saveSettings() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
    } catch (error) {
      say("تعذر حفظ الإعدادات في هذا المتصفح.");
    }
  }

  function openDatabase() {
    return new Promise((resolve, reject) => {
      if (!("indexedDB" in window)) {
        reject(new Error("IndexedDB غير مدعوم"));
        return;
      }

      const request = indexedDB.open(DB_NAME, 1);

      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains(DB_STORE)) {
          db.createObjectStore(DB_STORE);
        }
      };

      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async function saveImage(blob) {
    const db = await openDatabase();

    return new Promise((resolve, reject) => {
      const transaction = db.transaction(DB_STORE, "readwrite");
      transaction.objectStore(DB_STORE).put(blob, DB_KEY);

      transaction.oncomplete = () => {
        db.close();
        resolve();
      };

      transaction.onerror = () => {
        db.close();
        reject(transaction.error);
      };
    });
  }

  async function loadImage() {
    const db = await openDatabase();

    return new Promise((resolve, reject) => {
      const transaction = db.transaction(DB_STORE, "readonly");
      const request = transaction.objectStore(DB_STORE).get(DB_KEY);

      request.onsuccess = () => {
        const result = request.result || null;
        db.close();
        resolve(result);
      };

      request.onerror = () => {
        db.close();
        reject(request.error);
      };
    });
  }

  async function deleteImage() {
    const db = await openDatabase();

    return new Promise((resolve, reject) => {
      const transaction = db.transaction(DB_STORE, "readwrite");
      transaction.objectStore(DB_STORE).delete(DB_KEY);

      transaction.oncomplete = () => {
        db.close();
        resolve();
      };

      transaction.onerror = () => {
        db.close();
        reject(transaction.error);
      };
    });
  }

  function showImage(blob) {
    if (imageUrl) URL.revokeObjectURL(imageUrl);

    imageUrl = URL.createObjectURL(blob);
    imageLayer.style.backgroundImage = `url("${imageUrl}")`;
    imageLayer.style.opacity = "1";
  }

  function applyBackground() {
    if (settings.mode === "gradient") {
      layer.style.background =
        `linear-gradient(${settings.angle}deg, ${settings.color1}, ${settings.color2})`;
    } else {
      layer.style.background = settings.color;
    }

    imageLayer.style.setProperty(
      "--background-blur",
      `${settings.blur * 0.15}px`
    );

    imageLayer.style.opacity =
      settings.mode === "image" && imageUrl ? "1" : "0";

    modeButtons.forEach(button => {
      const selected = button.dataset.backgroundMode === settings.mode;
      button.classList.toggle("selected", selected);
      button.setAttribute("aria-pressed", String(selected));
    });

    panels.forEach(panel => {
      panel.hidden = panel.dataset.backgroundPanel !== settings.mode;
    });
  }

  function syncInputs() {
    colorInput.value = settings.color;
    color1Input.value = settings.color1;
    color2Input.value = settings.color2;
    angleInput.value = settings.angle;
    blurInput.value = settings.blur;
    angleValue.textContent = `${settings.angle}°`;
    blurValue.textContent = `${settings.blur}%`;
  }

  function update() {
    applyBackground();
    saveSettings();
  }

  modeButtons.forEach(button => {
    button.addEventListener("click", () => {
      settings.mode = button.dataset.backgroundMode;
      update();
    });
  });

  colorInput.addEventListener("input", () => {
    settings.color = colorInput.value;
    update();
  });

  color1Input.addEventListener("input", () => {
    settings.color1 = color1Input.value;
    update();
  });

  color2Input.addEventListener("input", () => {
    settings.color2 = color2Input.value;
    update();
  });

  angleInput.addEventListener("input", () => {
    settings.angle = Number(angleInput.value);
    angleValue.textContent = `${settings.angle}°`;
    update();
  });

  blurInput.addEventListener("input", () => {
    settings.blur = Number(blurInput.value);
    blurValue.textContent = `${settings.blur}%`;
    update();
  });

  imageInput.addEventListener("change", async () => {
    const file = imageInput.files && imageInput.files[0];
    if (!file) return;

    if (!file.type.startsWith("image/")) {
      say("الملف المختار ليس صورة.");
      imageInput.value = "";
      return;
    }

    say("جارٍ حفظ الصورة...");

    try {
      await saveImage(file);
      showImage(file);
      settings.mode = "image";
      update();
      say("تم حفظ الصورة بنجاح على هذا الجهاز.");
    } catch (error) {
      say("تعذر حفظ الصورة. تحقق من مساحة المتصفح.");
    }
  });

  resetButton.addEventListener("click", async () => {
    settings = { ...defaults };
    syncInputs();

    if (imageUrl) {
      URL.revokeObjectURL(imageUrl);
      imageUrl = null;
    }

    imageLayer.style.backgroundImage = "none";
    imageLayer.style.opacity = "0";

    try {
      await deleteImage();
    } catch (error) {
      say("أعيدت الإعدادات، لكن تعذر حذف الصورة المحفوظة.");
    }

    update();
    imageInput.value = "";
    say("تمت إعادة الخلفية إلى الوضع الافتراضي.");
  });

  async function initialize() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

      if (saved && typeof saved === "object" && !Array.isArray(saved)) {
        settings = { ...defaults, ...saved };
      }
    } catch (error) {
      settings = { ...defaults };
    }

    const validModes = ["color", "gradient", "image"];
    if (!validModes.includes(settings.mode)) settings.mode = "color";

    if (!/^#[0-9a-fA-F]{6}$/.test(settings.color)) settings.color = defaults.color;
    if (!/^#[0-9a-fA-F]{6}$/.test(settings.color1)) settings.color1 = defaults.color1;
    if (!/^#[0-9a-fA-F]{6}$/.test(settings.color2)) settings.color2 = defaults.color2;

    settings.angle = Math.max(0, Math.min(360, Number(settings.angle) || 0));
    settings.blur = Math.max(0, Math.min(100, Number(settings.blur) || 0));

    syncInputs();

    try {
      const savedImage = await loadImage();
      if (savedImage) showImage(savedImage);
    } catch (error) {
      say("تعذر استرجاع الصورة المحفوظة.");
    }

    applyBackground();
  }

  initialize();
})();
</script>

<script>
(async function () {
  const text = document.getElementById("accountText");
  const loginLink = document.getElementById("loginLink");
  const logoutBtn = document.getElementById("logoutBtn");
  function show(user) {
    if (user) {
      text.textContent = user.email;
      loginLink.hidden = true;
      logoutBtn.hidden = false;
    } else {
      text.textContent = "غير مسجّل الدخول";
      loginLink.hidden = false;
      logoutBtn.hidden = true;
    }
  }
  try { show(await Auth.getUser()); } catch (e) { show(null); }
  logoutBtn.addEventListener("click", async () => {
    await Auth.signOut();
    show(null);
  });
})();
</script>
